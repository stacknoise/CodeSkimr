# Inputs of the reference tools that are not part of the scanned sources (tools/accuracy/measure.py).
# They only let the reference compiler resolve every name of the corpus project; none of them is
# read by CodeSkimr. Every download is pinned by a SHA-256 and checked before use.

[java]
# Compile-time dependencies of the corpus project (its pom.xml lists them), fetched once into
# target/accuracy-cache.
dependencies = [
    { url = "https://repo1.maven.org/maven2/com/google/errorprone/error_prone_annotations/2.51.0/error_prone_annotations-2.51.0.jar", sha256 = "51a6d8348c7e307e47183859c07597dc8a2899c5d1b6f18a471bccaa3203d5cf" },
]
# Sources that Maven generates from templates; the corpus skips the template folder, the compiler needs the result.
template_dir = "gson/src/main/java-templates"
template_values = { "${project.version}" = "0" }
