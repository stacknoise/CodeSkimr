# Maps a benchmark id (criterion group and name, as the directory under target/criterion) to the
# budget key in config/default.toml [budgets] it must stay below. Budgets are in milliseconds.
# Add an entry together with the benchmark that measures the budgeted interaction.
[benchmarks]
"graph_layout/nodes_200" = "graph_layout_ms"
"graph_layers/layers_200" = "graph_layout_ms"
"usages/depth_2" = "usages_query_ms"
"usages_page/depth_2_hub" = "usages_query_ms"
"alerts/step_100_critical" = "incremental_rescan_ms"
"alerts/step_50_vanished" = "incremental_rescan_ms"
"search/typed_1" = "search_keystroke_ms"
"type_switch/explorer_symbol" = "explorer_switch_ms"
"scan/full_100k_loc" = "full_scan_100k_loc_ms"
"rescan/one_file_100k_loc" = "incremental_rescan_ms"
"pack_load/rust_and_csharp" = "pack_load_ms"

# Slowdowns against the base commit that are accepted on purpose; the absolute budget above still
# applies. Each entry names the ADR that explains it and is removed again once the base commit
# contains the change (the next pull request measures against the new numbers).
[accepted]
# ADR 0089: the usages are read from the database; the index is no longer built in memory at start.
"usages_page/depth_2_hub" = "ADR 0089"
