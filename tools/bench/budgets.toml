# Maps a benchmark id (criterion group and name, as the directory under target/criterion) to the
# budget key in config/default.toml [budgets] it must stay below. Budgets are in milliseconds.
# Add an entry together with the benchmark that measures the budgeted interaction.
[benchmarks]
"graph_layout/nodes_200" = "graph_layout_ms"
"graph_layers/layers_200" = "graph_layout_ms"
"usages/depth_2" = "usages_query_ms"
"scan/full_100k_loc" = "full_scan_100k_loc_ms"
"rescan/one_file_100k_loc" = "incremental_rescan_ms"
