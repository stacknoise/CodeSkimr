# Rust reference of CI (blueprint 17.2, ADR 0026). Updating the commit is a deliberate change with
# new expected values. The reference is CodeSkimr itself at a pinned commit; the source of the
# crates is scanned, tests, benchmarks, tools, the web UI and the data folders are skipped.

[project]
repository = "https://github.com/stacknoise/CodeSkimr"
commit = "bcc970e90cb99c2d052457f79090a78194dfaa8e"
skip_folders = ["tests", "benches", "tools", "web", "target", "node_modules", "languages", "corpus", "docs", "locales", "errors", "config"]
language = "rust"
extensions = ["rs"]

# Symbols per kind over all *.rs files of the crates; `module` is one per file. `namespace` counts
# every `mod` item, with and without body (also `mod tests` inside a source file); `constant`
# counts `const` and `static` items, also the associated constants of traits and impls; `method`
# every function of an `impl` or trait; `field` the named fields of structs, unions and enum
# variants; `type_alias` also associated types.
[counts]
files = 147
module = 147
namespace = 150
struct = 182
enum = 32
enum_member = 127
trait = 18
type_alias = 34
constant = 383
function = 340
method = 375
field = 581

