# config/default.toml - every tunable value of CodeSkimr (blueprint section 14).
# It ships with the binary. Overrides are applied in this order:
# user config file -> project config (.codeskimr.toml) -> command line flags.
# Every key listed here is the complete set: unknown keys in an override are rejected (CFG-103).

# Architecture layers of the scanned project (ADR 0031). Empty by default; a project sets them in its
# .codeskimr.toml as `[[layers]]` tables with `name` and `namespaces` (qualified-name prefixes).
layers = []

# Metric thresholds (blueprint 14). "good" and "medium" bounds; everything beyond is "poor".
[metrics]
# Cyclomatic complexity: at most this value is good, at most the medium value is medium.
cyclomatic_good_max = 5
cyclomatic_medium_max = 10
# Maintainability index: at least this value is good, at least the medium value is medium.
maintainability_good_min = 55
maintainability_medium_min = 35
# Instability (0.0 to 1.0): at most this value is stable, at most the medium value is medium.
instability_stable_max = 0.5
instability_medium_max = 0.8

# Performance budgets (blueprint 16.1). CI measures them; the app uses them for self-checks.
[budgets]
cold_start_ms = 300
search_keystroke_ms = 10
explorer_switch_ms = 16
usages_query_ms = 20
graph_layout_ms = 50
full_scan_100k_loc_ms = 1000
incremental_rescan_ms = 300
idle_cpu_percent = 0
memory_1m_loc_mb = 500
binary_size_mb = 60
# A regression larger than this fails the benchmark check.
regression_tolerance_percent = 10

# Limits for MCP responses (blueprint 10): compact answers, never unbounded lists.
[mcp]
default_limit = 20
max_limit = 100
# Steps a usages walk goes when the caller gives no depth, and the most it may go (also the depth
# of impact_of_change).
default_depth = 1
max_depth = 5
# find_similar_code lists functions from this similarity in percent when the caller gives none,
# and takes snippets up to this size in bytes.
default_similarity_percent = 50
max_snippet_bytes = 32768

# Snapshot retention (blueprint 6): the last N snapshots per project are kept.
[snapshots]
retention_count = 5

# File watcher (blueprint 7).
[watcher]
# File events within this window are collapsed into one re-scan.
debounce_ms = 200
# A batch of file events is handed over at the latest this long after its first event, so a build that writes all the time cannot starve the re-scan.
max_wait_ms = 2000

# Syntax fingerprints for similar-code search and the duplicate check (blueprint 10.4).
[similarity]
# Number of syntax tokens per n-gram that is hashed.
ngram_size = 5
# Number of consecutive n-grams per winnowing window; a shared run of window + ngram - 1 tokens is always found.
window_size = 4
# Functions with fewer syntax tokens than this get no fingerprints; trivial bodies are not worth matching.
min_tokens = 30

# Convention checks (blueprint 3 and 10.4, `check_conventions`).
[conventions]
# Longest function in code lines (R-02); a longer one is reported as CHK-104.
max_function_lines = 40
# Two functions whose syntax fingerprints are at least this similar, in percent, are reported as CHK-102.
duplicate_similarity_percent = 85
# Functions with fewer code lines than this are not compared for duplicates (CHK-102); measured on this repository: 5 gives 21 findings, 8 gives 9, mostly real.
duplicate_min_lines = 8
# Files below a folder with one of these names are tests; the convention checks skip them.
test_folders = ["tests", "benches"]

# Scanning.
[scan]
# Folder names that are never scanned, at any depth.
excluded_folders = ["bin", "obj", ".git", "node_modules", "target", "dist"]
# Time limit for parsing one file, in milliseconds; a file that takes longer fails with PRS-501.
parse_timeout_ms = 5000
# Largest total size of the scanned files of one source, in megabytes; a larger source fails with SRC-501.
max_source_mb = 2048
# Longest signature of a symbol, in characters. A constant's signature is its whole declaration with
# the value, so a large object or array literal is cut here and ends with "…".
max_signature_chars = 400

# Level 2 references from SCIP indexes (ADR 0033). The whole table is read from the default file, the
# user config file and command line flags only; a `level2` table in the `.codeskimr.toml` of a project
# is ignored, so that a scanned repository cannot switch on running its own build scripts.
[level2]
# Master switch for running indexers (their build tools run project code). Off by default; even when
# it is on, every project needs one confirmation by the local owner before an indexer starts.
enabled = false
# Longest time one indexer may run, in seconds; then it is stopped together with all its child
# processes and fails with RES-502 (level 1 stays).
timeout_seconds = 900
# Most memory, in megabytes, that an indexer and its child processes together may hold; more fails
# with RES-504 (level 1 stays).
max_memory_mb = 4096
# Most bytes an indexer may write in total, console output and files in its temporary output
# directory (512 MiB, above max_index_bytes); more fails with RES-503 (level 1 stays).
max_output_bytes = 536870912
# Largest SCIP index file that is read, in bytes (256 MiB); a larger one is refused with RES-501 and level 1 stays.
max_index_bytes = 268435456
# Share mapped / (mapped + unmapped) among the uses of project symbols (symbols the index itself defines; library symbols are not counted) that an index must reach; a lower share, or an index where no use maps, fails with RES-302 and level 1 stays.
min_mapped = 0.5

# Local server (blueprint 10.3, S-04). It listens on the loopback address 127.0.0.1 only.
[server]
# TCP port of the local server. A port that is already taken fails with API-301.
port = 7421

# Editor link of the UI (blueprint 15.4, ADR 0028): "Open in editor" makes the browser open this URL.
[editor]
# {path} and {line} are percent-encoded when inserted. The scheme must be one of allowed_schemes.
url_template = "vscode://file/{path}:{line}"
# Schemes a template may use; any other scheme is refused with CFG-101.
allowed_schemes = ["vscode", "vscode-insiders", "vscodium", "cursor", "idea", "zed", "subl"]

# Web UI (blueprint 15.3, ADR 0028, ADR 0030).
[ui]
# Theme used until the user chooses one (without a dark operating system setting).
default_theme = "petrol"
# Folder with the built UI. A relative path is looked up next to the program, then in the current folder.
dir = "ui"
# How long a one-time launch code is valid, in seconds (ADR 0028).
launch_code_seconds = 60

# Picture of the dependency map (blueprint 15, screen 3). Layout units are pixels.
[graph]
# Size of the box of one layer.
node_width = 160
node_height = 44
# Space between two rows and between two boxes of a row.
rank_gap = 60
node_gap = 24
# Effort of the layout: sweeps against crossing edges and passes that centre boxes between their neighbours.
sweeps = 12
placement_passes = 6
