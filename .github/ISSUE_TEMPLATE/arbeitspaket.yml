name: Work package
description: One work package from the plan (one issue, one branch, one PR)
labels: ["status:blocked"]
body:
  - type: input
    id: wp
    attributes:
      label: Work package ID
      placeholder: WP-18
    validations: { required: true }
  - type: textarea
    id: goal
    attributes:
      label: Goal and result
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable without reading Rust code.
    validations: { required: true }
  - type: textarea
    id: deps
    attributes:
      label: Depends on
      description: Issue numbers. Set status:ready when all are merged.
  - type: input
    id: wave
    attributes:
      label: Wave
  - type: input
    id: sections
    attributes:
      label: Blueprint sections to read first
  - type: dropdown
    id: role
    attributes:
      label: Role
      options: [Core developer, Language developer, Frontend developer, Tooling, QA, Docs and release, Architect, Product owner]
    validations: { required: true }
