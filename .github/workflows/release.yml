# Release workflow (docs/release.md). Started by hand: Actions -> Release -> Run workflow.
# It creates a DRAFT release (a pre-release only for a version with a suffix), then builds the UI and the program on Linux, Windows and macOS, adds one single file
# per system (with SHA-256 checksum and GitHub provenance attestation) and then runs each file on a clean runner of its
# own system (clean-install probe).
# Nothing is public until the product owner publishes the draft.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, for example 1.0.0 (must match Cargo.toml)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  draft:
    name: draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version has the right form and matches Cargo.toml
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "Not a version: $VERSION" >&2
            exit 1
          fi
          found=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$found" != "$VERSION" ]; then
            echo "Cargo.toml has version $found, the input is $VERSION" >&2
            exit 1
          fi
      - name: Create the draft release (empty, the packages are added by the next jobs)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          # A run that failed half way leaves a draft behind: start over with a fresh one.
          # A published release is never touched (the run stops there).
          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft)
          published=$(jq -r 'map(select(.tagName == "v" + env.VERSION and .isDraft == false)) | length' <<< "$releases")
          drafts=$(jq -r 'map(select(.tagName == "v" + env.VERSION and .isDraft == true)) | length' <<< "$releases")
          if [ "$published" != "0" ]; then
            echo "v${VERSION} is already published" >&2
            exit 1
          fi
          if [ "$drafts" != "0" ]; then
            gh release delete "v${VERSION}" --repo "$GITHUB_REPOSITORY" --yes
          fi
          # Only a version with a suffix (1.0.0-rc.1, 0.9.0-preview.1) is marked as a pre-release.
          flags=(--draft)
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "CodeSkimr ${VERSION}" --notes-file docs/release/notes-de.md "${flags[@]}"

  package:
    name: package (${{ matrix.platform }})
    needs: draft
    permissions:
      contents: write
      id-token: write # the provenance attestation is signed with the OIDC token of the run
      attestations: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-latest
            platform: macos-aarch64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The UI is embedded into the program by crates/app/build.rs, so it is built first.
      - name: Build the UI
        run: |
          cd web
          npm ci
          npm run build
      - name: Build the program
        run: cargo build --release --locked -p codeskimr
      - name: Smoke test
        run: target/release/codeskimr --version
      - name: Prepare the asset and its checksum
        env:
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: tools/release/package.sh "$PLATFORM" "$VERSION"
      # Proves that GitHub built this file from this repository and commit (verify with `gh attestation verify`).
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/codeskimr-*
            !dist/*.sha256
      - name: Add the asset to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "v${VERSION}" dist/codeskimr-* --repo "$GITHUB_REPOSITORY"

  # Clean-install probe: a fresh runner per system downloads the file from the draft like a user would, checks the
  # checksum and the provenance, puts it alone into an empty folder and runs it from there (tools/release/verify.sh).
  verify:
    name: clean install (${{ matrix.platform }})
    needs: package
    permissions:
      contents: write # a draft release is only visible to a token with write access
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            suffix: ""
          - os: windows-latest
            platform: windows-x86_64
            suffix: .exe
          - os: macos-latest
            platform: macos-aarch64
            suffix: ""
    defaults:
      run:
        shell: bash
    steps:
      # Only the script is taken from the repository; no Rust toolchain, no source of the program is used.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/release
      - name: Download the package from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir download
          gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" --dir download \
            --pattern "codeskimr-${VERSION}-${PLATFORM}*"
      - name: Verify the build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.platform }}
          SUFFIX: ${{ matrix.suffix }}
        run: gh attestation verify "download/codeskimr-${VERSION}-${PLATFORM}${SUFFIX}" --repo "$GITHUB_REPOSITORY"
      - name: Verify and run from an empty folder
        env:
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.platform }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          asset="download/codeskimr-${VERSION}-${PLATFORM}${SUFFIX}"
          if [ "$RUNNER_OS" = Linux ]; then
            # The start without arguments needs a Secret Service: gnome-keyring in a private D-Bus session,
            # as in the CI job for the credential store. The probe itself stays as strict as on the other systems.
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gnome-keyring dbus-x11
            ASSET="$asset" dbus-run-session -- bash -c '
              set -euo pipefail
              eval "$(echo ci-keyring | gnome-keyring-daemon --daemonize --unlock --components=secrets)"
              tools/release/verify.sh "$ASSET" "$VERSION"
            '
          else
            tools/release/verify.sh "$asset" "$VERSION"
          fi
