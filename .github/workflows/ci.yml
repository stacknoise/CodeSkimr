# CI pipeline (blueprint 17.3). Every job name below is a required check in the ruleset:
# pr-title, fmt, clippy, test, deps, build (ubuntu-latest), build (windows-latest),
# build (macos-latest), architecture, duplicates, literals, codegen, bench, e2e.
# Temporary: build (macos-latest) is non-blocking, see docs/ci.md and issue #131.
# Never rename a job without telling the product owner; the ruleset matches by name.
name: CI

on:
  pull_request:
    # edited: re-check the PR title after a rename (pr-title would stay red otherwise).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Conventional Commits, because the squash-merged PR title becomes the commit (CLAUDE.md rule 3).
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        with:
          types: |
            feat
            fix
            refactor
            test
            docs
            chore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: prettier (only once the frontend exists)
        run: |
          if [ -f web/package.json ]; then
            cd web && npm ci && npx prettier --check .
          else
            echo "No web/ yet, prettier check skipped."
          fi

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Workspace lints in Cargo.toml and thresholds in clippy.toml are binding; warnings are errors.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo test
        run: cargo test --workspace --all-features --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The unit tests and the type check of the UI (ADR 0028).
      - name: UI type check and unit tests
        run: |
          cd web
          npm ci
          npm run typecheck
          npm test

  deps:
    name: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit,cargo-deny,cargo-machete
      # S-03: a known vulnerability blocks the merge.
      - name: cargo audit
        run: cargo audit --deny warnings
      - name: cargo deny
        run: cargo deny --locked check
      # The lint lives in its own Cargo workspace (about 120 packages), which the two checks above do
      # not see. It runs in CI with the same rules (issue #25).
      - name: cargo audit (lint workspace)
        run: cargo audit --file tools/lints/no_literals/Cargo.lock --deny warnings --ignore RUSTSEC-2024-0436
      - name: cargo deny (lint workspace)
        run: cargo deny --locked --manifest-path tools/lints/no_literals/Cargo.toml --config deny.toml check
      # Section 16: lean dependencies, no unused ones.
      - name: cargo machete
        run: cargo machete
      # Section 12: Git must never send credentials over plain HTTP. The feature that allows it is a
      # dev-dependency of the login tests and must not be part of the product (issue #58).
      - name: no plain-HTTP credentials in the product
        run: |
          # Capture first: a failing `cargo tree` must fail the step, not look like "no match".
          tree=$(cargo tree --locked -p codeskimr -e normal,build,features)
          test -n "$tree"
          if printf '%s\n' "$tree" | grep -F 'insecure-credentials'; then
            echo "::error::http-client-insecure-credentials is active in the product build"
            exit 1
          fi

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # TEMPORARY (see docs/ci.md, issue #131): macOS runners are not available reliably, so a failing or
    # hanging macOS build must not block merges. The check still reports.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 20 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo build
        run: cargo build --workspace --release --locked

  # ADR 0033: the level 2 runner kills a process group on Unix and a job object on Windows. The test job
  # runs on Linux only, so the tests of the runner (timeout, cancel, child processes, limits) run on
  # Windows here. Not in the ruleset yet; it reports, and the product owner decides about requiring it.
  indexer-windows:
    name: test (windows-latest, indexer)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo test (indexer runner)
        run: cargo test -p codeskimr_indexer --all-features --locked

  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # R-04: crate dependency direction (4.2) and module cycles inside each crate.
      - name: Unit tests of the check
        run: python3 -m unittest discover -s tools/ci
      - name: Crate dependency direction and module cycles
        run: python3 tools/ci/check_architecture.py

  duplicates:
    name: duplicates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # R-01: zero tolerance, 5 lines / 50 tokens. Settings live in .jscpd.json.
      - name: jscpd
        run: npx --yes jscpd@4.0.5 --config .jscpd.json

  # The next checks exist so that the ruleset can already require them.
  # They pass trivially until their tool exists (literals and codegen are already real), and they then run for real without a rename.
  # R-06: Dylint lint `no_literals` (tools/lints) on the product crates, then its own test cases, then ESLint for web/.
  literals:
    name: literals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The lint is pinned to its own nightly toolchain (tools/lints/no_literals/rust-toolchain.toml).
      - name: Install lint toolchain
        working-directory: tools/lints/no_literals
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            tools/lints/no_literals
      # The lint must not be silenced (CLAUDE.md rule 5, issue #25): the name may only appear inside
      # its own folder. This also catches `cfg_attr`, multi-line attributes, `[lints]` tables and flags.
      - name: no_literals is not silenced
        run: |
          if git grep -n 'no_literals' -- '*.rs' '*Cargo.toml' '.cargo' ':!tools/lints/no_literals'; then
            echo "::error::no_literals is named outside tools/lints/no_literals; silencing the lint is not allowed"
            exit 1
          fi
      - name: Install cargo-dylint
        working-directory: tools/lints/no_literals
        run: cargo install --locked cargo-dylint@6.4.0 dylint-link@6.4.0
      - name: Lint test cases
        working-directory: tools/lints/no_literals
        run: cargo test --locked
      - name: no_literals on the workspace
        run: cargo dylint --path tools/lints/no_literals --workspace
      - name: ESLint (no-magic-numbers, i18next/no-literal-string)
        run: |
          if [ -f web/package.json ]; then
            cd web
            npm ci
            npx eslint --config eslint.literals.config.js src
          else
            echo "ESLint part not active yet: web/package.json does not exist (rules are prepared in web/eslint.literals.config.js)."
          fi

  codegen:
    name: codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # 17.3 (6): regenerate everything, then fail on any difference (also untracked files).
      - name: Regenerate error code artifacts
        run: cargo run --locked -p codeskimr_codegen
      - name: Generated code is up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::Generated files are out of date. Run 'cargo run -p codeskimr_codegen' and commit the result."
            exit 1
          fi
      # The one command above also writes the i18n keys and the design tokens (CSS, TypeScript and
      # theme-init.js) and checks the themes for completeness and contrast (blueprint 15.3).
      - name: Other generators (OpenAPI client)
        run: |
          echo "NOT ACTIVE YET: the OpenAPI client needs real command types (ADR 0024)."

  bench:
    name: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Base commit and change are measured one after the other on this runner; only the ratio
      # counts (docs/benchmarks.md). A slowdown above regression_tolerance_percent fails the job.
      - name: Benchmarks against base commit and budgets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: tools/bench/ci.sh "$BASE_SHA"

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The tests start the real server over an in-memory keystore (crates/app/src/e2e.rs) and drive
      # the built UI with Chromium: launch code, token, content security policy, themes.
      - name: End-to-end tests of the UI
        run: |
          cd web
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm run e2e -- --trace off
      # Visual tests of every screen in all three themes (blueprint 17.1) come with the screens.
