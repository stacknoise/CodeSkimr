# CI pipeline (blueprint 17.3). Every job name below is a required check in the ruleset:
# pr-title, fmt, clippy, test, deps, build (ubuntu-latest), build (windows-latest),
# build (macos-latest), architecture, duplicates, literals, codegen, bench, e2e.
# Never rename a job without telling the product owner; the ruleset matches by name.
name: CI

on:
  pull_request:
    # edited: re-check the PR title after a rename (pr-title would stay red otherwise).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Conventional Commits, because the squash-merged PR title becomes the commit (CLAUDE.md rule 3).
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        with:
          types: |
            feat
            fix
            refactor
            test
            docs
            chore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: prettier (only once the frontend exists)
        run: |
          if [ -f web/package.json ]; then
            cd web && npm ci && npx prettier --check .
          else
            echo "No web/ yet, prettier check skipped."
          fi

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Workspace lints in Cargo.toml and thresholds in clippy.toml are binding; warnings are errors.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo test
        run: cargo test --workspace --all-features --locked
      # Issue #197: the credential store against a real Secret Service. gnome-keyring runs inside a
      # private D-Bus session with a throwaway login password, which also creates the default collection; CODESKIMR_REAL_KEYSTORE turns the tests
      # on, so a missing service fails here instead of being skipped.
      - name: Credential store against a real Secret Service
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus-x11
          dbus-run-session -- bash -c '
            set -euo pipefail
            eval "$(echo ci-keyring | gnome-keyring-daemon --daemonize --unlock --components=secrets)"
            CODESKIMR_REAL_KEYSTORE=1 cargo test -p codeskimr_secrets --test os_keystore --locked
          '
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The unit tests and the type check of the UI (ADR 0028).
      - name: UI type check and unit tests
        run: |
          cd web
          npm ci
          npm run typecheck
          npm test

  deps:
    name: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit,cargo-deny,cargo-machete
      # S-03: a known vulnerability blocks the merge.
      - name: cargo audit
        run: cargo audit --deny warnings
      - name: cargo deny
        run: cargo deny --locked check
      # The lint lives in its own Cargo workspace (about 120 packages), which the two checks above do
      # not see. It runs in CI with the same rules (issue #25).
      - name: cargo audit (lint workspace)
        run: cargo audit --file tools/lints/no_literals/Cargo.lock --deny warnings --ignore RUSTSEC-2024-0436
      - name: cargo deny (lint workspace)
        run: cargo deny --locked --manifest-path tools/lints/no_literals/Cargo.toml --config deny.toml check
      # Section 16: lean dependencies, no unused ones.
      - name: cargo machete
        run: cargo machete
      # Issue #243: the measuring tool tools/accuracy/import_scip is a workspace of its own with its own
      # Cargo.lock, so the checks above do not see it. Same strict rules. (The lint workspace is covered above.)
      - name: cargo audit, deny and machete (import_scip workspace)
        run: |
          # This lock file follows the product crates it depends on (path dependencies): a PR that adds or
          # changes a dependency of them must refresh it, otherwise this step fails here with a clear hint.
          if ! cargo metadata --locked --format-version 1 --manifest-path tools/accuracy/import_scip/Cargo.toml > /dev/null; then
            echo "::error::tools/accuracy/import_scip/Cargo.lock is out of date. Run 'cargo update --workspace --manifest-path tools/accuracy/import_scip/Cargo.toml' and commit it."
            exit 1
          fi
          cargo audit --deny warnings -f tools/accuracy/import_scip/Cargo.lock
          cargo deny --manifest-path tools/accuracy/import_scip/Cargo.toml --config deny.toml --locked check
          cargo machete tools/accuracy/import_scip
      # Section 12: Git must never send credentials over plain HTTP. The feature that allows it is a
      # dev-dependency of the login tests and must not be part of the product (issue #58).
      - name: no plain-HTTP credentials in the product
        run: |
          # Capture first: a failing `cargo tree` must fail the step, not look like "no match".
          tree=$(cargo tree --locked -p codeskimr -e normal,build,features)
          test -n "$tree"
          if printf '%s\n' "$tree" | grep -F 'insecure-credentials'; then
            echo "::error::http-client-insecure-credentials is active in the product build"
            exit 1
          fi

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo build
        run: cargo build --workspace --release --locked
      # Issue #197: the credential store against the real Keychain and Credential Manager.
      - name: Credential store against the real keystore
        if: runner.os != 'Linux'
        env:
          CODESKIMR_REAL_KEYSTORE: "1"
        run: cargo test -p codeskimr_secrets --test os_keystore --locked
      # Issue #320: the connection cap test holds about 512 sockets at once, and macOS allows only 256
      # open files by default (EMFILE), so the limit is raised for this step.
      - name: Connection and stream limits (open file limit raised)
        if: runner.os == 'macOS'
        run: |
          ulimit -n 4096
          cargo test -p codeskimr_server --test limits --locked

  # ADR 0033: the level 2 runner kills a process group on Unix and a job object on Windows. The test job
  # runs on Linux only, so the tests of the runner (timeout, cancel, child processes, limits) run on
  # Windows here. Not in the ruleset yet; it reports, and the product owner decides about requiring it.
  indexer-windows:
    name: test (windows-latest, indexer)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo test (indexer runner)
        run: cargo test -p codeskimr_indexer --all-features --locked
      # Issue #104: the launch file folder (access rules, junctions) only runs on Windows.
      - name: cargo test (launch file on Windows)
        run: cargo test -p codeskimr --bins launch_file --locked

  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # R-04: crate dependency direction (4.2) and module cycles inside each crate.
      - name: Unit tests of the check
        run: python3 -m unittest discover -s tools/ci
      - name: Unit tests of the changelog generator
        run: python3 -m unittest discover -s tools/release
      - name: Crate dependency direction and module cycles
        run: python3 tools/ci/check_architecture.py
      # Windows and macOS see two paths that differ only in case as one file (the UI build broke on
      # Preview.tsx and preview.ts), so the repository must not contain such a pair.
      - name: No paths that differ only in case
        run: |
          git -c core.quotePath=false ls-files | python3 -c '
          import collections, sys
          seen = collections.defaultdict(list)
          for line in sys.stdin.read().splitlines():
              seen[line.casefold()].append(line)
          clashes = [names for names in seen.values() if len(names) > 1]
          for names in clashes:
              print("Paths that differ only in case:", *names, file=sys.stderr)
          sys.exit(1 if clashes else 0)
          '
      # Blueprint 12.4: every expose_secret() call in product code is on the approved list.
      - name: Approved expose_secret() call sites
        run: python3 tools/ci/check_expose_secret.py

  duplicates:
    name: duplicates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # R-01: zero tolerance, 5 lines / 50 tokens. Settings live in .jscpd.json.
      - name: jscpd
        run: npx --yes jscpd@4.0.5 --config .jscpd.json

  # The next checks exist so that the ruleset can already require them.
  # They pass trivially until their tool exists (literals and codegen are already real), and they then run for real without a rename.
  # R-06: Dylint lint `no_literals` (tools/lints) on the product crates, then its own test cases, then ESLint for web/.
  literals:
    name: literals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The lint is pinned to its own nightly toolchain (tools/lints/no_literals/rust-toolchain.toml).
      - name: Install lint toolchain
        working-directory: tools/lints/no_literals
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            tools/lints/no_literals
      # The lint must not be silenced (CLAUDE.md rule 5, issue #25): the name may only appear inside
      # its own folder. This also catches `cfg_attr`, multi-line attributes, `[lints]` tables and flags.
      - name: no_literals is not silenced
        run: |
          # git grep: 0 = found, 1 = nothing found, anything else = the search itself failed.
          status=0
          git grep -n 'no_literals' -- '*.rs' '*Cargo.toml' '.cargo' ':!tools/lints/no_literals' || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::no_literals is named outside tools/lints/no_literals; silencing the lint is not allowed"
            exit 1
          fi
          test "$status" -eq 1
      - name: Install cargo-dylint
        working-directory: tools/lints/no_literals
        run: cargo install --locked cargo-dylint@6.4.0 dylint-link@6.4.0
      - name: Lint test cases
        working-directory: tools/lints/no_literals
        run: cargo test --locked
      - name: no_literals on the workspace
        run: cargo dylint --path tools/lints/no_literals --workspace
      - name: ESLint (no-magic-numbers, i18next/no-literal-string)
        run: |
          if [ -f web/package.json ]; then
            cd web
            npm ci
            npx eslint --config eslint.literals.config.js src
          else
            echo "ESLint part not active yet: web/package.json does not exist (rules are prepared in web/eslint.literals.config.js)."
          fi

  codegen:
    name: codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # 17.3 (6): regenerate everything, then fail on any difference (also untracked files).
      - name: Regenerate error code artifacts
        run: cargo run --locked -p codeskimr_codegen
      - name: Generated code is up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::Generated files are out of date. Run 'cargo run -p codeskimr_codegen' and commit the result."
            exit 1
          fi
      # The one command above also writes the i18n keys and the design tokens (CSS, TypeScript and
      # theme-init.js) and checks the themes for completeness and contrast (blueprint 15.3).
      - name: Other generators (OpenAPI client)
        run: |
          echo "NOT ACTIVE YET: the OpenAPI client needs real command types (ADR 0024)."

  bench:
    name: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Base commit and change are measured one after the other on this runner; only the ratio
      # counts (docs/benchmarks.md). A slowdown above regression_tolerance_percent fails the job.
      - name: Benchmarks against base commit and budgets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: tools/bench/ci.sh "$BASE_SHA"

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The tests start the real server over an in-memory keystore (crates/app/src/e2e.rs) and drive
      # the built UI with Chromium: launch code, token, content security policy, themes.
      - name: End-to-end tests of the UI
        run: |
          cd web
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm run e2e -- --trace off
      # Visual tests of every screen in all three themes (blueprint 17.1) come with the screens.
