# errors/error-codes.toml - single source of truth for all error codes (blueprint section 11).
# Codes are never reused or renumbered; retire one with `deprecated = true`.
# Every code needs an `error-<id>` message in locales/<lang>/errors.ftl for each language.

[groups.APP]
title = "Application start and lifecycle"
crate = "codeskimr"

[groups.CFG]
title = "Configuration"
crate = "codeskimr_application"

[groups.PRJ]
title = "Projects and snapshots"
crate = "codeskimr_application"

[groups.SRC]
title = "Sources: file system, Git, watcher"
crate = "codeskimr_source"

[groups.PRS]
title = "Parsing and language packs"
crate = "codeskimr_parsing"

[groups.RES]
title = "Reference resolution"
crate = "codeskimr_parsing"

[groups.IDX]
title = "Search and read models"
crate = "codeskimr_storage"

[groups.STO]
title = "Persistence"
crate = "codeskimr_storage"

[groups.SEC]
title = "Credentials and security"
crate = "codeskimr_secrets"

[groups.NET]
title = "Network and platforms (GitHub, GitLab ...)"
crate = "codeskimr_source"

[groups.AUTH]
title = "Caller identity and permissions"
crate = "codeskimr_application"

[groups.API]
title = "REST and WebSocket"
crate = "codeskimr_server"

[groups.MCP]
title = "MCP server"
crate = "codeskimr_mcp"

[groups.CLI]
title = "Command line"
crate = "codeskimr_cli"

[groups.I18N]
title = "Translations"
crate = "codeskimr_i18n"

[groups.EXP]
title = "Export"
crate = "codeskimr_application"

[groups.UI]
title = "Frontend"
crate = "web"

[groups.CHK]
title = "Convention-check findings (not failures)"
crate = "codeskimr_application"

[[codes]]
