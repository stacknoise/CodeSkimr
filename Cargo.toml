[workspace]
resolver = "3"
members = [
    "crates/codes",
    "crates/domain",
    "crates/application",
    "crates/adapters/parsing",
    "crates/adapters/storage",
    "crates/adapters/source",
    "crates/adapters/secrets",
    "crates/adapters/i18n",
    "crates/server",
    "crates/cli",
    "crates/mcp",
    "crates/app",
    "tools/codegen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/stacknoise/CodeSkimr"

[workspace.dependencies]
thiserror = "2"

# Binding rules from blueprint section 3 and 17.3. Thresholds live in clippy.toml.
[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
cognitive_complexity = "deny"
