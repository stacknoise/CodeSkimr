[workspace]
resolver = "3"
members = [
    "crates/adapters/indexer",
    "crates/codes",
    "crates/domain",
    "crates/application",
    "crates/adapters/parsing",
    "crates/adapters/storage",
    "crates/adapters/source",
    "crates/adapters/secrets",
    "crates/adapters/i18n",
    "crates/adapters/scip",
    "crates/server",
    "crates/cli",
    "crates/mcp",
    "crates/app",
    "tools/codegen",
    "tools/bench",
]

[workspace.package]
version = "0.9.0-preview.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/stacknoise/CodeSkimr"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "1"
blake3 = "1"
gix = { version = "0.90", default-features = false, features = ["sha1", "blocking-network-client", "blocking-http-transport-reqwest-native-tls", "worktree-mutation"] }
ignore = "0.4"
notify = "8"
memory-stats = "1"
tempfile = "3"
secrecy = { version = "0.10", features = ["serde"] }
zeroize = "1"
# Locks secret buffers against swapping (blueprint 12.4); used only in `codeskimr_secrets::memory`.
# Exclusive file lock that serialises the first start of several programs (issue #269).
fs4 = { version = "1", default-features = false, features = ["sync"] }
memsec = { version = "0.7", default-features = false, features = ["alloc"] }
# Names the length-limit error of a request body, to tell "too large" from "client left".
http-body-util = { version = "0.1", default-features = false }
libc = "0.2"
windows-sys = { version = "0.61", default-features = false }
keyring-core = "1"
# Reads a secret from the terminal without echo.
rpassword = "7"
# Same version and TLS backend as the one `gix` already uses for Git over HTTPS.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
# Test-only, must match the version `gix` uses (see crates/adapters/source/Cargo.toml).
gix-transport = "0.62"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-java = "0.23"
tree-sitter-kotlin-sg = "0.4"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.25"
# Level 2 indexers (ADR 0033): a process group on Unix and a job object on Windows, so that a
# timeout or cancel kills the indexer with every child it started. Safe API, no unsafe in our code.
process-wrap = { version = "10", default-features = false, features = ["std", "process-group", "job-object", "creation-flags"] }
# Level 2 indexers: reads the memory of the process tree to enforce level2.max_memory_mb.
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
serde_json = "1"
criterion = { version = "0.7", default-features = false }
rmcp = { version = "3.10", default-features = false, features = ["server", "schemars", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1.54", default-features = false }
tower-service = "0.3"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
getrandom = "0.4"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }

# Binding rules from blueprint section 3 and 17.3. Thresholds live in clippy.toml.
[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
cognitive_complexity = "deny"
