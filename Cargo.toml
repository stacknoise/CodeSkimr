[workspace]
resolver = "3"
members = [
    "crates/codes",
    "crates/domain",
    "crates/application",
    "crates/adapters/parsing",
    "crates/adapters/storage",
    "crates/adapters/source",
    "crates/adapters/secrets",
    "crates/adapters/i18n",
    "crates/server",
    "crates/cli",
    "crates/mcp",
    "crates/app",
    "tools/codegen",
    "tools/bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/stacknoise/CodeSkimr"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "1"
blake3 = "1"
gix = { version = "0.90", default-features = false, features = ["sha1", "blocking-network-client", "blocking-http-transport-reqwest-native-tls", "worktree-mutation"] }
ignore = "0.4"
notify = "8"
tempfile = "3"
secrecy = "0.10"
zeroize = "1"
keyring-core = "1"
# Test-only, must match the version `gix` uses (see crates/adapters/source/Cargo.toml).
gix-transport = "0.62"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-c-sharp = "0.23"
serde_json = "1"
criterion = { version = "0.7", default-features = false }
rmcp = { version = "3.10", default-features = false, features = ["server", "schemars", "transport-io"] }
tokio = { version = "1.54", default-features = false }

# Binding rules from blueprint section 3 and 17.3. Thresholds live in clippy.toml.
[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
cognitive_complexity = "deny"

# TEMPORARY (WP-11): the skeleton crates declare their allowed dependencies (blueprint 4.2)
# before they contain code, so cargo-machete would flag them. Remove entries as the crates get code;
# the list must be empty at M1 (see docs/ci.md).
[workspace.metadata.cargo-machete]
ignored = [
    "codeskimr_application",
    "codeskimr_cli",
    "codeskimr_codes",
    "codeskimr_domain",
    "codeskimr_i18n",
    "codeskimr_mcp",
    "codeskimr_parsing",
    "codeskimr_secrets",
    "codeskimr_server",
    "codeskimr_source",
    "codeskimr_storage",
    "thiserror",
]
