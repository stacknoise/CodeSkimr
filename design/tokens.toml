# design/tokens.toml - design tokens of the UI (blueprint 15.3, ADR 0021, ADR 0028).
# tools/codegen turns this file into web/src/shared/theme/tokens.css, tokens.ts and
# web/public/theme-init.js. Every theme defines every token; the job `codegen` fails if one is
# missing or if a text/background pair is below 4.5:1 (blueprint 15.3, "Rules").
# A theme is a table below [themes]; its display name is in locales/*/settings.ftl.

[meta]
# Order in which the themes are offered.
themes = ["hell", "petrol", "dunkel"]
# Theme until the user chooses one (also the key ui.default_theme in config/default.toml).
default_theme = "petrol"
# Theme until the user chooses one, if the operating system is set to dark.
dark_theme = "dunkel"
# Key of the localStorage mirror of the choice (ADR 0028).
storage_key = "codeskimr.theme"

# Values that do not depend on the theme.
[shared]
font_sans = "Inter"
font_mono = "JetBrains Mono"
radius = { badge = 4, button = 6, card = 8, panel = 10, dialog = 14 }
spacing = [4, 6, 8, 10, 12, 16, 24, 32]

