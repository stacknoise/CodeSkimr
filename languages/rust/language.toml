# Rust language pack, full tier (blueprint 8, WP-65, ADR 0026).
#
# Mapping of Rust onto the language-neutral symbol kinds:
#   mod                                -> namespace    struct               -> struct
#   union                              -> union        enum, enum variant   -> enum / enum_member
#   trait                              -> trait        type alias           -> type_alias
#   associated type (in a trait)       -> type_alias   const, static        -> constant
#   fn in a module or in a function    -> function     fn in impl or trait  -> method
#   named field of a struct or variant -> field
# `impl` blocks are no symbols but containers (ADR 0039): their functions are methods of the type
# the block names (`mod::Type::method`; the type is the parent if it is declared in the same
# module before the block, else only the name carries it; a head such as `&Type` or `a::Type` has no
# container). Not symbols: parameters, local variables, closures (they count for their function),
# tuple struct fields, `use` declarations, macros (`macro_rules!` and their calls), `extern`
# blocks and associated consts of impls that are not constants of a trait. Documentation is
# `///` and `/** */` directly above the declaration (attributes may stand between); `//!` and
# `/*! */` (documentation of a module or crate) are not read.
# Visibility follows `pub`: `pub` is public, `pub(crate)` and `pub(in path)` internal,
# `pub(super)` protected, `pub(self)` and no keyword private. Variants of an enum and members of a
# trait are public, and so is a function of a trait implementation (`impl Trait for Type`).
# A function without `self` in an impl or trait is static.
id = "rust"
grammar = "rust"
tier = "full"
extensions = ["rs"]
separator = "::"
comment_nodes = ["line_comment", "block_comment"]
manifest_files = ["Cargo.toml", "rust-toolchain.toml", "rust-toolchain"]
test_patterns = [
    "**/tests/**/*.rs",
    "**/benches/**/*.rs",
    "**/*_test.rs",
    "**/*_tests.rs",
    "**/tests.rs",
]
# Syntax fingerprints (WP-34): all names alike, literals by kind only.
identifier_nodes = ["identifier", "field_identifier", "type_identifier"]
literal_nodes = [
    "integer_literal",
    "float_literal",
    "string_literal",
    "raw_string_literal",
    "char_literal",
    "boolean_literal",
]
# Doc comments: `///` lines and `/** */` blocks.
doc_prefixes = ["///"]
# The comments directly above a declaration (attributes may stand between) are its documentation.
doc_before_declaration = ["attribute_item"]

[doc_block]
open = "/**"
close = "*/"
line_prefix = "*"

[visibility]
default = "private"

# The words are the tokens of the visibility modifier: `pub(crate)` is the words `pub crate`.
[visibility.keywords]
pub = "public"
crate = "internal"
super = "protected"
self = "private"
in = "internal"
"pub crate" = "internal"
"pub in" = "internal"
"pub super" = "protected"
"pub self" = "private"
# A function of a trait implementation takes the visibility of the trait (see symbols.scm).
for = "public"

[visibility.parent_defaults]
trait = "public"
enum = "public"
enum_member = "public"

# Level 2 (ADR 0033): `rust-analyzer scip` indexes the cargo workspace in the project folder.
# Only runs when the user enabled and confirmed level 2 for the project. CodeSkimr never downloads or
# installs anything: the user installs the indexer and its toolchain.
[indexer]
name = "rust-analyzer"
install_hint = "rustup component add rust-analyzer (needs the Rust toolchain with cargo)"
args = ["scip", "{project}", "--output", "{output}"]
env_allow = ["CARGO_HOME", "RUSTUP_HOME", "RUSTUP_TOOLCHAIN"]
# The rustup proxy would download the toolchain that a `rust-toolchain.toml` of the project names.
env = { RUSTUP_AUTO_INSTALL = "0" }

[indexer.tool]
program = "rust-analyzer"
version_args = ["--version"]
min_version = "1.78.0"

[[indexer.toolchain]]
program = "cargo"
version_args = ["--version"]
min_version = "1.78.0"
# The version the project asks for (checked besides min_version; the newer one counts).
requirement = { file = "rust-toolchain.toml", format = "toml", path = ["toolchain", "channel"] }
