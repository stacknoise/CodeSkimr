# JavaScript language pack (with JSX), full tier (blueprint 8, WP-60, ADR 0022).
#
# Mapping of JavaScript onto the language-neutral symbol kinds:
#   class                           -> class       function, generator          -> function
#   const with a function value     -> function    other module-level const     -> constant
#   method                          -> method      constructor                  -> constructor
#   get / set accessor              -> property    class field                  -> field
#   field with an arrow function    -> method
# Not symbols: parameters, local variables, `let` and `var`, `export { x }` lists, anonymous
# default exports, `module.exports` and CommonJS assignments. Names that are strings, numbers or
# computed are skipped.
id = "javascript"
grammar = "javascript"
tier = "full"
extensions = ["js", "mjs", "cjs", "jsx"]
separator = "."
comment_nodes = ["comment"]
manifest_files = ["package.json", "jsconfig.json"]
test_patterns = [
    "**/*.test.js",
    "**/*.test.jsx",
    "**/*.test.mjs",
    "**/*.spec.js",
    "**/*.spec.jsx",
    "**/__tests__/**/*.js",
    "**/test/**/*.js",
    "**/tests/**/*.js",
]
# Syntax fingerprints: all names alike, literals by kind only.
identifier_nodes = [
    "identifier",
    "property_identifier",
    "shorthand_property_identifier",
    "private_property_identifier",
]
literal_nodes = [
    "number",
    "string",
    "template_string",
    "regex",
    "true",
    "false",
    "null",
    "undefined",
]
static_keywords = ["static"]

# JSDoc: the description above the first block tag (`@param`, `@returns` …) is the documentation.
[doc_block]
open = "/**"
close = "*/"
line_prefix = "*"
stop_at = "@"

# A `const` is a constant; accessors are properties.
[modifier_kinds]
const = "constant"
get = "property"
set = "property"

# A top-level declaration is visible outside its file only with `export`; class members are public
# (`#name` fields are private in the language but carry no keyword; see ADR 0022).
[visibility]
default = "public"

[visibility.keywords]
export = "public"

[visibility.parent_defaults]
module = "private"

# Level 2 (ADR 0033): scip-typescript indexes TypeScript and JavaScript; --infer-tsconfig lets it index a project without a tsconfig.json.
# Only runs when the user enabled and confirmed level 2 for the project. CodeSkimr never downloads or
# installs anything: the user installs the indexer and its toolchain.
[indexer]
name = "scip-typescript"
install_hint = "npm install --global @sourcegraph/scip-typescript (needs Node.js and the installed node_modules of the project)"
args = ["index", "--output", "{output}", "--infer-tsconfig"]
env_allow = ["NODE_PATH", "NVM_DIR", "VOLTA_HOME", "FNM_DIR", "NPM_CONFIG_CACHE"]

[indexer.tool]
program = "scip-typescript"
version_args = ["--version"]
min_version = "0.3.0"

[[indexer.toolchain]]
program = "node"
version_args = ["--version"]
min_version = "18.0.0"
# The version the project asks for (checked besides min_version; the newer one counts).
requirement = { file = ".nvmrc", format = "text" }
