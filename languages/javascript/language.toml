# JavaScript language pack (with JSX), full tier (blueprint 8, WP-60, ADR 0022).
#
# Mapping of JavaScript onto the language-neutral symbol kinds:
#   class                           -> class       function, generator          -> function
#   const with a function value     -> function    other module-level const     -> constant
#   method                          -> method      constructor                  -> constructor
#   get / set accessor              -> property    class field                  -> field
#   field with an arrow function    -> method
# Not symbols: parameters, local variables, `let` and `var`, `export { x }` lists, anonymous
# default exports, `module.exports` and CommonJS assignments. Names that are strings, numbers or
# computed are skipped.
id = "javascript"
grammar = "javascript"
tier = "full"
extensions = ["js", "mjs", "cjs", "jsx"]
separator = "."
comment_nodes = ["comment"]
manifest_files = ["package.json", "jsconfig.json"]
test_patterns = [
    "**/*.test.js",
    "**/*.test.jsx",
    "**/*.test.mjs",
    "**/*.spec.js",
    "**/*.spec.jsx",
    "**/__tests__/**/*.js",
    "**/test/**/*.js",
    "**/tests/**/*.js",
]
# Syntax fingerprints: all names alike, literals by kind only.
identifier_nodes = [
    "identifier",
    "property_identifier",
    "shorthand_property_identifier",
    "private_property_identifier",
]
literal_nodes = [
    "number",
    "string",
    "template_string",
    "regex",
    "true",
    "false",
    "null",
    "undefined",
]
static_keywords = ["static"]

# JSDoc: the description above the first block tag (`@param`, `@returns` …) is the documentation.
[doc_block]
open = "/**"
close = "*/"
line_prefix = "*"
stop_at = "@"

# A `const` is a constant; accessors are properties.
[modifier_kinds]
const = "constant"
get = "property"
set = "property"

# A top-level declaration is visible outside its file only with `export`; class members are public
# (`#name` fields are private in the language but carry no keyword; see ADR 0022).
[visibility]
default = "public"

[visibility.keywords]
export = "public"

[visibility.parent_defaults]
module = "private"

# Tools that level 2 needs (ADR 0033, decisions 1 and 8). On every load of a project CodeSkimr
# checks that each exists and, where a version is stated, is new enough. The indexer and its
# version are settled by the spike of ADR 0033, so `min_version` stays out until then; a version
# the project itself names (see `requirement`) is always checked.

[[tools]]
id = "scip-typescript"
role = "indexer"
command = "scip-typescript"
version_args = ["--version"]
purpose_key = "tool-scip-typescript-purpose"
install_key = "tool-scip-typescript-install"

[[tools]]
id = "node"
role = "toolchain"
command = "node"
version_args = ["--version"]
purpose_key = "tool-node-purpose"
install_key = "tool-node-install"

[tools.requirement]
file = ".nvmrc"
format = "text"
