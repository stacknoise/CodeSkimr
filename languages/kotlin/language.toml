# Kotlin language pack, full tier (blueprint 8, WP-63, ADR 0027).
#
# Mapping of Kotlin onto the language-neutral symbol kinds:
#   package header                      -> namespace    class                  -> class
#   interface, fun interface            -> interface    enum class             -> enum
#   data class                          -> record       annotation class       -> interface
#   object, named companion object      -> class        typealias              -> type_alias
#   fun in a type                       -> method       fun elsewhere          -> function
#   secondary constructor               -> constructor  property               -> property
#   const val                           -> constant     val / var parameter of the primary
#   enum entry                          -> enum_member    constructor          -> property
# Not symbols: parameters, local variables and properties, lambdas and anonymous functions (they
# count for their callable), the primary constructor itself, initializer blocks, accessors
# (`get`, `set`), type parameters, an unnamed companion object (its members belong to the
# surrounding class) and the members of an anonymous object (functions of the enclosing callable).
# Visibility: `public` is the default, `internal` is visible in the module, `protected` and
# `private` as written.
id = "kotlin"
grammar = "kotlin"
tier = "full"
extensions = ["kt", "kts"]
separator = "."
comment_nodes = ["line_comment", "multiline_comment"]
manifest_files = [
    "build.gradle.kts",
    "settings.gradle.kts",
    "build.gradle",
    "settings.gradle",
    "pom.xml",
]
test_patterns = [
    "**/src/test/**/*.kt",
    "**/src/*Test/**/*.kt",
    "**/*Test.kt",
    "**/*Tests.kt",
    "**/*IT.kt",
]
# The grammar has no `body` field: a function without a `function_body` is abstract or declared in
# an interface and is not measured; a secondary constructor holds its `statements`.
body_nodes = ["function_body", "statements"]
# Syntax fingerprints (WP-34): all names alike, literals by kind only.
identifier_nodes = ["simple_identifier", "type_identifier"]
literal_nodes = [
    "integer_literal",
    "long_literal",
    "hex_literal",
    "bin_literal",
    "real_literal",
    "string_literal",
    "character_literal",
    "boolean_literal",
    "null_literal",
]

# KDoc: the description above the first block tag (`@param`, `@return` ...) is the documentation;
# `[Name]` links and Markdown stay in the text.
[doc_block]
open = "/**"
close = "*/"
line_prefix = "*"
stop_at = "@"

# `const val` is a constant; a class that is `enum`, `annotation` or `data` has its own kind.
[modifier_kinds]
const = "constant"
enum = "enum"
annotation = "interface"
data = "record"

# A function of a type is a method; the entries of an enum may carry a body of their own.
[kinds_by_parent.class]
function = "method"
[kinds_by_parent.interface]
function = "method"
[kinds_by_parent.enum]
function = "method"
[kinds_by_parent.record]
function = "method"
[kinds_by_parent.enum_member]
function = "method"

[visibility]
default = "public"
# A package has no visibility.
unrated_kinds = ["namespace"]

[visibility.keywords]
public = "public"
internal = "internal"
protected = "protected"
private = "private"

# Tools that level 2 needs (ADR 0033, decisions 1 and 8). On every load of a project CodeSkimr
# checks that each exists and, where a version is stated, is new enough. The indexer and its
# version are settled by the spike of ADR 0033, so `min_version` stays out until then; a version
# the project itself names (see `requirement`) is always checked.

[[tools]]
id = "scip-java"
role = "indexer"
command = "scip-java"
version_args = ["--version"]
purpose_key = "tool-scip-java-purpose"
install_key = "tool-scip-java-install"

[[tools]]
id = "java"
role = "toolchain"
command = "java"
version_args = ["-version"]
purpose_key = "tool-java-purpose"
install_key = "tool-java-install"
