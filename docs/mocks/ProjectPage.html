.pi{padding:10px 14px;border-bottom:1px solid var(--soft);display:flex;gap:10px;align-items:center}.pi.sel{background:var(--accentbg);box-shadow:inset 3px 0 0 var(--accent)}
.dot{width:9px;height:9px;border-radius:5px;flex:none;background:var(--muted)}.dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.acc{background:var(--accent)}.dot.n{background:var(--line)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px}.tab{padding:10px 12px;border-bottom:2px solid transparent;color:var(--ink2)}.tab.on{border-color:var(--accent);color:var(--accent);font-weight:600}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.pc{min-width:0;padding:14px 16px;display:flex;flex-direction:column;gap:10px}.pc.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
