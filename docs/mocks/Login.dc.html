<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Anmelden</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:var(--bg)}
*{box-sizing:border-box}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--accent-hover)}
.root{font-family:Inter,system-ui,sans-serif;color:var(--ink);font-size:13px;background:var(--bg);height:900px;display:flex;flex-direction:column}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px}
.muted{color:var(--muted)}
.kbd{font:500 11px 'JetBrains Mono',monospace;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
.top{height:48px;flex:none;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{width:24px;height:24px;border-radius:6px;background:var(--ink);color:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.search{flex:1 1 320px;max-width:560px;height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--muted)}
.body{flex:1;display:flex;min-height:0;flex-wrap:wrap}
.rail{width:56px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0}
.rb{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;color:var(--muted)}
.rb:hover{background:var(--bg);color:var(--ink)}
.rb.on{background:var(--accent-bg);color:var(--accent)}
.main{flex:999 1 560px;min-width:0;padding:24px 32px;display:flex;flex-direction:column;gap:16px;overflow:auto}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.sub{margin:4px 0 0;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--accent);border-color:var(--accent);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.pad{padding:16px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--muted);font-size:12px;font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.sel td{background:var(--accent-bg)}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--line-soft);color:var(--ink2);white-space:nowrap}
.pill.acc{background:var(--accent-bg);color:var(--accent)}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.av{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--accent-bg);color:var(--accent);font-weight:600;font-size:12px;flex:none}
.btn{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:500 13px Inter,sans-serif;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.inp{height:32px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:var(--surface);color:var(--ink);font:13px Inter,sans-serif;display:flex;align-items:center;min-width:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.split{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.split>.l{flex:3 1 560px;min-width:0}.split>.r{flex:1 1 320px;min-width:0}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 12px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.ck{text-align:center;font-weight:700}.ck.y{color:var(--good)}.ck.n{color:var(--faint);font-weight:400}
.note{font-size:12px;color:var(--muted);margin:0}
.h2{font-size:14px;font-weight:600;margin:0}
.foot{height:28px;flex:none;display:flex;align-items:center;gap:18px;padding:0 16px;background:var(--surface);border-top:1px solid var(--line);color:var(--muted);font:11.5px 'JetBrains Mono',monospace;overflow:hidden;white-space:nowrap}
.foot .ok{color:var(--good)}
.hit:hover{background:var(--bg)}
.login{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:400px;max-width:100%;display:flex;flex-direction:column;gap:12px;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.or:before,.or:after{content:"";height:1px;background:var(--line);flex:1}
.fld{display:flex;flex-direction:column;gap:4px}.fld label{color:var(--muted);font-size:12px}
.theme{border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.theme.on{border-color:var(--accent)}
.pv{border:1px solid var(--pv-line);border-radius:10px;overflow:hidden;background:var(--pv-bg);color:var(--pv-ink);font-size:11px;height:190px;display:flex;flex-direction:column}
.pv .bar{height:22px;background:var(--pv-surface);border-bottom:1px solid var(--pv-line);display:flex;align-items:center;gap:6px;padding:0 8px}
.pv .mid{flex:1;display:flex;min-height:0}
.pv .rl{width:22px;background:var(--pv-surface);border-right:1px solid var(--pv-line);display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px}
.pv .rl i{width:10px;height:10px;border-radius:3px;background:var(--pv-line)}.pv .rl i.a{background:var(--pv-accent)}
.pv .cn{flex:1;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pv .ln{height:18px;border-radius:4px;background:var(--pv-surface);border:1px solid var(--pv-line);display:flex;align-items:center;gap:6px;padding:0 6px}
.pv .ln.s{background:var(--pv-accent-bg);border-color:var(--pv-accent)}
.pv .b{border-radius:4px;padding:0 5px;font-weight:600}
.sw{display:flex;gap:4px}.sw i{width:16px;height:16px;border-radius:4px;border:1px solid var(--line)}
</style>
</helmet>
<div class="root" style="{{vars}}">
<div class="login"><div class="card">
 <div class="row" style="gap:10px"><div class="logo">C</div><span style="font-weight:600;font-size:16px">CodeSkimr</span></div>
 <div><h1 style="font-size:20px">Anmelden</h1><p class="sub">Team-Server „Entwicklung“</p></div>
 <a class="btn pri" style="height:40px;justify-content:center" href="Users.dc.html">Mit Entra ID anmelden</a>
 <div class="or">oder lokales Konto</div>
 <div class="fld"><label for="m">E-Mail</label><div class="inp" id="m">anton@example.org</div></div>
 <div class="fld"><label for="p">Passwort</label><div class="inp" id="p">••••••••••••</div></div>
 <a class="btn" style="height:40px;justify-content:center" href="Users.dc.html">Anmelden</a>
 <p class="note" style="text-align:center">Lokale Konten gelten für den ersten Admin und kleine Setups. Sie lassen sich abschalten, sobald SSO läuft.</p>
</div></div>
<footer class="foot"><span>skimr.example.org · TLS</span><span style="margin-left:auto">Beispieldaten</span></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "select", "options": ["hell", "petrol", "dunkel"], "default": "petrol", "section": "Darstellung"}, "$preview": {"width": 1440, "height": 900}}'>
// Theme values: same names and values as design/tokens.toml (blueprint 15.3). Layout never depends on the theme.
const THEMES = {
 "hell": {
  "bg": "#F6F7F9",
  "surface": "#FFFFFF",
  "line": "#E3E6EB",
  "line-soft": "#EEF0F3",
  "ink": "#14171C",
  "ink2": "#3A414C",
  "muted": "#5B6370",
  "faint": "#6B7280",
  "accent": "#2457D6",
  "accent-bg": "#EAF0FD",
  "accent-hover": "#1A43A8",
  "accent-fg": "#FFFFFF",
  "good": "#15803D",
  "good-bg": "#EAF7EF",
  "warn": "#B45309",
  "warn-bg": "#FFF4E5",
  "bad": "#B91C1C",
  "bad-bg": "#FDF2F2",
  "outgoing": "#C2410C",
  "highlight": "#FFF7D6",
  "mark": "#FDE68A"
 },
 "petrol": {
  "bg": "#F4F6F8",
  "surface": "#FFFFFF",
  "line": "#DDE3EA",
  "line-soft": "#E8EDF2",
  "ink": "#1B2430",
  "ink2": "#3A4656",
  "muted": "#5D6B7C",
  "faint": "#5F6E80",
  "accent": "#0C727B",
  "accent-bg": "#DFF1F2",
  "accent-hover": "#095A62",
  "accent-fg": "#FFFFFF",
  "good": "#1F7A45",
  "good-bg": "#DDF3E5",
  "warn": "#8A5A00",
  "warn-bg": "#FBECCB",
  "bad": "#A82D2D",
  "bad-bg": "#F9DCDC",
  "outgoing": "#C2410C",
  "highlight": "#FFF7D6",
  "mark": "#FDE68A"
 },
 "dunkel": {
  "bg": "#12171D",
  "surface": "#1A212A",
  "line": "#2C3643",
  "line-soft": "#232C37",
  "ink": "#E6EBF1",
  "ink2": "#C5CED9",
  "muted": "#97A4B4",
  "faint": "#8996A6",
  "accent": "#3BB6C1",
  "accent-bg": "#16363B",
  "accent-hover": "#66CAD3",
  "accent-fg": "#06222A",
  "good": "#5FD18B",
  "good-bg": "#173826",
  "warn": "#F0BD5A",
  "warn-bg": "#3A2D10",
  "bad": "#FF8C8C",
  "bad-bg": "#401B1B",
  "outgoing": "#FB923C",
  "highlight": "#3A3413",
  "mark": "#6B5A12"
 }
};
class Component extends DCLogic {
  renderVals() {
    const t = THEMES[this.props.theme] || THEMES.petrol;
    const vars = Object.keys(t).map(k => '--' + k + ':' + t[k]).join(';');
    return { vars };
  }
}
</script>
</body>
</html>
