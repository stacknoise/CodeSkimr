# cargo-deny configuration (blueprint S-03). Loosening this file needs an ADR.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# `paste` is unmaintained (no known vulnerability). It is only a build-time dependency of
# `dylint_linting` in the lint workspace (tools/lints/no_literals), never of the product, and the
# newest `dylint_linting` (6.4.0) still uses it. Remove this entry when Dylint drops it (ADR 0043).
# `chrono` is unmaintained (RUSTSEC-2026-0543, no vulnerability). It is a fixed dependency of `rmcp` (every
# version, no feature turns it off) and `rmcp` switches on `schemars/chrono04`. Time-limited exception until
# 2027-02-28 (ADR 0069). Remove this entry when `rmcp` drops `chrono` or the MCP library is replaced.
# `heapless` 0.8.0 has nine "unsound" advisories (RUSTSEC-2026-0574 to 0582, published 2026-11-18, patched in 0.9.4). It comes
# in only through `gix` -> `faster-hex` 0.10, which requires `heapless ^0.8`; no released `gix` uses `faster-hex` 1.x yet.
# None of the affected functions is used. Time-limited exception until 2027-02-28 (ADR 0073). Remove the entries
# when `gix` has moved to `faster-hex` 1.x.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono only reaches the product through rmcp, which cannot drop it (ADR 0069)" },
    { id = "RUSTSEC-2026-0574", reason = "heapless 0.8 only reaches the product through gix -> faster-hex 0.10; unsound, no affected function is used (ADR 0073)" },
    { id = "RUSTSEC-2026-0575", reason = "heapless 0.8 only reaches the product through gix -> faster-hex 0.10; unsound, no affected function is used (ADR 0073)" },
    { id = "RUSTSEC-2026-0576", reason = "heapless 0.8 only reaches the product through gix -> faster-hex 0.10; unsound, no affected function is used (ADR 0073)" },
    { id = "RUSTSEC-2026-0577", reason = "heapless 0.8 only reaches the product through gix -> faster-hex 0.10; unsound, no affected function is used (ADR 0073)" },
    { id = "RUSTSEC-2026-0578", reason = "heapless 0.8 only reaches the product through gix -> faster-hex 0.10; unsound, no affected function is used (ADR 0073)" },
    { id = "RUSTSEC-2026-0579", reason = "heapless 0.8 only reaches the product through gix -> faster-hex 0.10; unsound, no affected function is used (ADR 0073)" },
    { id = "RUSTSEC-2026-0580", reason = "heapless 0.8 only reaches the product through gix -> faster-hex 0.10; unsound, no affected function is used (ADR 0073)" },
    { id = "RUSTSEC-2026-0581", reason = "heapless 0.8 only reaches the product through gix -> faster-hex 0.10; unsound, no affected function is used (ADR 0073)" },
    { id = "RUSTSEC-2026-0582", reason = "heapless 0.8 only reaches the product through gix -> faster-hex 0.10; unsound, no affected function is used (ADR 0073)" },
    { id = "RUSTSEC-2024-0436", reason = "paste only reaches the lint workspace through dylint_linting" },
]

[licenses]
version = 2
# The project is MIT; only permissive licenses are accepted for dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates are path dependencies without a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
