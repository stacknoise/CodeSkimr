# cargo-deny configuration (blueprint S-03). Loosening this file needs an ADR.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# `paste` is unmaintained (no known vulnerability). It is only a build-time dependency of
# `dylint_linting` in the lint workspace (tools/lints/no_literals), never of the product, and the
# newest `dylint_linting` (6.4.0) still uses it. Remove this entry when Dylint drops it (ADR 0043).
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste only reaches the lint workspace through dylint_linting" },
]

[licenses]
version = 2
# The project is MIT; only permissive licenses are accepted for dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates are path dependencies without a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
