[package]
name = "codeskimr_secrets"
description = "Credential store and secret handling. No other adapter may be used here."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
codeskimr_application = { path = "../../application" }
codeskimr_domain = { path = "../../domain" }
codeskimr_codes = { path = "../../codes" }
keyring-core = { workspace = true }
reqwest = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

# The platform stores are chosen here instead of the `keyring` crate, whose Linux store pulls
# `zbus` 5 with `zvariant`, `zvariant_derive` and `zbus_names`, all flagged unmaintained by the
# advisory database (`deps` check). See ADR 0018.
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust", "vendored"] }
