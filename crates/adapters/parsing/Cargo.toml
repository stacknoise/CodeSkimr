[package]
name = "codeskimr_parsing"
description = "Tree-sitter parsing and the language-pack interpreter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["basic-grammars"]
# Grammars of the basic tier (blueprint 8.2, ADR 0020). Without them only the full-tier grammars
# are built in and a basic pack fails to load with PRS-301.
basic-grammars = [
    "dep:tree-sitter-go",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-ruby",
    "dep:tree-sitter-php",
]

[dependencies]
codeskimr_application = { path = "../../application" }
codeskimr_domain = { path = "../../domain" }
codeskimr_codes = { path = "../../codes" }
thiserror = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-c-sharp = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-java = { workspace = true }
tree-sitter-kotlin-sg = { workspace = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-c = { workspace = true, optional = true }
tree-sitter-cpp = { workspace = true, optional = true }
tree-sitter-ruby = { workspace = true, optional = true }
tree-sitter-php = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
