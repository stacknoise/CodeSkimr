[package]
name = "codeskimr_source"
description = "Sources: file system, Git and file watching."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
codeskimr_application = { path = "../../application" }
codeskimr_domain = { path = "../../domain" }
codeskimr_codes = { path = "../../codes" }
thiserror = { workspace = true }
blake3 = { workspace = true }
gix = { workspace = true }
ignore = { workspace = true }
notify = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Test-only: the login tests talk to a local server over plain HTTP, which Git refuses for
# credentials in the product build. The feature is not enabled for the release build.
gix-transport = { workspace = true, features = ["http-client-insecure-credentials"] }
