[package]
name = "codeskimr_indexer"
description = "Level 2 references: runs the indexer of a language as a guarded child process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
codeskimr_application = { path = "../../application" }
codeskimr_codes = { path = "../../codes" }
thiserror = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }
process-wrap = { workspace = true }
sysinfo = { workspace = true }

[dev-dependencies]
codeskimr_domain = { path = "../../domain" }

# A stand-in for a real indexer: the tests start it instead of scip-dotnet and the like.
[[bin]]
name = "fake_indexer"
path = "tests/support/fake_indexer.rs"
test = false
doc = false
