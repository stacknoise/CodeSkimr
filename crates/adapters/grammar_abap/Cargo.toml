[package]
name = "codeskimr_grammar_abap"
description = "The ABAP Tree-sitter grammar (zooloo303/tree-sitter-abap, MIT), compiled from the vendored C source."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

# R-08 allows `unsafe` only in `codeskimr_secrets::memory`; this crate is the second place, for the
# one call that turns the C entry point of the grammar into a `LanguageFn` (ADR 0113).
[lints.rust]
missing_docs = "deny"
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
tree-sitter = { workspace = true }
