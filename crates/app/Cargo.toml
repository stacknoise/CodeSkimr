[package]
name = "codeskimr"
description = "Composition root: the only place where concrete adapters are created and wired."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
codeskimr_application = { path = "../application" }
codeskimr_domain = { path = "../domain", features = ["issue-principals"] }
codeskimr_codes = { path = "../codes" }
codeskimr_parsing = { path = "../adapters/parsing" }
codeskimr_storage = { path = "../adapters/storage" }
codeskimr_indexer = { path = "../adapters/indexer" }
codeskimr_scip = { path = "../adapters/scip" }
codeskimr_fsguard = { path = "../adapters/fsguard" }
codeskimr_source = { path = "../adapters/source" }
codeskimr_secrets = { path = "../adapters/secrets" }
codeskimr_i18n = { path = "../adapters/i18n" }
codeskimr_server = { path = "../server" }
codeskimr_cli = { path = "../cli" }
codeskimr_mcp = { path = "../mcp" }
tokio = { workspace = true, features = ["rt", "signal", "sync"] }
getrandom.workspace = true
memory-stats.workspace = true
sysinfo.workspace = true
secrecy.workspace = true
rpassword.workspace = true
zeroize.workspace = true
fs4.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true

# Unix only: `O_NOFOLLOW`, so that the log file is never opened through a link (ADR 0115).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Windows only: compares the open launch file with its path by the identity the system gives the file
# (volume and index), which needs no `unsafe` of ours (issue #372).
[target.'cfg(windows)'.dependencies]
same-file.workspace = true
# Reads the owner of the launch folder through a safe interface (issue #372).
windows-permissions.workspace = true

# Windows and macOS: the tray icon with its menu and the event loop it needs (ADR 0067). Linux has
# no common tray without extra system libraries, so it keeps the console.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd.workspace = true
tray-icon.workspace = true
winit.workspace = true

# Windows only, build time: embeds the app icon into the exe (the tray icon needs no extra crate).
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Test-only: the login canary test talks to a local server over plain HTTP, which Git refuses for
# credentials in the product build. The feature is not enabled for the release build.
gix-transport = { workspace = true, features = ["http-client-insecure-credentials"] }
